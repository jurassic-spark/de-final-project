name: Terraform

# Run on pushes and pull requests.
on:
  pull_request:

  push:
    branches:
      - main

concurrency:
  group: terraform-dev
  cancel-in-progress: false

# Give the workflow read access to the repository.
permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      # Download the repository onto the GitHub Actions runner.
      - name: Checkout
        uses: actions/checkout@v7

      # Access for GitHub to AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      # Set up the same Python version used by the Lambda function.
      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Build the Python dependencies required by the Lambda layers.
      - name: Build Lambda layers
        run: bash lambda_layers/build.sh

      # Install a fixed Terraform version.
      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.15.9"

      - name: Terraform Init
        working-directory: terraform
        run: terraform init -input=false

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        env:
          TF_VAR_notification_emails: '["genevievegarwood@gmail.com"]'
        run: terraform plan -input=false -lock-timeout=5m -out=tfplan

      - name: Terraform Apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: terraform
        env:
          TF_VAR_notification_emails: '["genevievegarwood@gmail.com"]'
        run: terraform apply -lock-timeout=5m tfplan