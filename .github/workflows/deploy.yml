name: Terraform

# Run on pushes and pull requests.
on:
  push:
  pull_request:

# Give the workflow read access to the repository.
permissions:
  contents: read

jobs:
  terraform:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      # Download the repository onto the GitHub Actions runner.
      - name: Checkout
        uses: actions/checkout@v7

      # Access for GitHub to AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      # Set up the same Python version used by the Lambda function.
      - name: Python Setup
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Build the Python dependencies required by the Lambda layers.
      - name: Build Lambda layers
        run: bash lambda_layers/build.sh

      # Install Terraform on the GitHub Actions runner.
      - name: Terraform Setup
        uses: hashicorp/setup-terraform@v3

      # Initialise the Terraform working directory.
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # Check that the Terraform configuration is valid.
      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      # Run Terraform plan to create execution plan
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      #Run Terraform apply
      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -auto-approve